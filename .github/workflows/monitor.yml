name: Monitor de boletas

"on":
  # El `schedule:` nativo de GitHub Actions no estaba disparando (ver
  # cf-worker/). Un Cloudflare Worker con Cron Trigger llama a este
  # workflow_dispatch cada 5 min en su lugar — es 100% confiable.
  workflow_dispatch: {}

# Evita que dos corridas se pisen si una tarda más de 5 minutos.
concurrency:
  group: ticket-monitor
  cancel-in-progress: false

permissions:
  contents: read
  statuses: write  # para publicar el resultado como commit status (lo lee el dashboard)

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Restaurar estado anterior
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: ticket-monitor-state-${{ github.run_id }}
          restore-keys: |
            ticket-monitor-state-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Revisar disponibilidad y comandos de Telegram
        env:
          EVENT_URL: ${{ vars.EVENT_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEARTBEAT_HOURS: "0.5"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python monitor.py --once

      - name: Guardar estado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: ticket-monitor-state-${{ github.run_id }}
